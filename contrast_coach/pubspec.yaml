name: contrast_coach
description: "Contrast therapy tracker (sauna + cold plunge)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^15.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_analytics: ^11.4.0
  google_sign_in: ^6.2.2
  health: ^11.0.0
  speech_to_text: ^7.4.0
  just_audio: ^0.9.46
  purchases_flutter: 8.2.0
  flutter_local_notifications: ^17.2.4
  dio: ^5.9.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  lucide_icons_flutter: ^3.1.14+2
  intl: ^0.19.0
  uuid: ^4.5.3
  permission_handler: ^11.3.1
  drift: ^2.20.3
  sqlcipher_flutter_libs: ^0.6.0
  workmanager: ^0.6.0
  firebase_crashlytics: ^4.3.7
  google_fonts: ^6.2.1
  share_plus: ^11.0.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: 2.4.7
  mocktail: ^1.0.5
  patrol_cli: ^3.5.1
  very_good_analysis: ^7.0.0
  drift_dev: ^2.20.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/protocols.json
    - assets/changelog.json
    - assets/audio/session_start.wav
    - assets/audio/phase_transition.wav
    - assets/audio/session_complete.wav
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
