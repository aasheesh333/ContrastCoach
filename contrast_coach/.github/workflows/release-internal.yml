name: Release Internal

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build AAB + upload artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Upload to Play Store (internal track)
        if: ${{ env.PLAY_SERVICE_ACCOUNT != '' }}
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: com.contrastcoach.contrast_coach
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          mappingFile: build/app/outputs/mapping/release/mapping.txt
        continue-on-error: true
