name: Release Internal

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build AAB + upload artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contrast_coach
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/contrast_coach"
          flutter pub get

      - name: Verify code generation
        run: |
          cd "$GITHUB_WORKSPACE/contrast_coach"
          dart run build_runner build --delete-conflicting-outputs

      - name: Build App Bundle
        run: |
          cd "$GITHUB_WORKSPACE/contrast_coach"
          flutter build appbundle --release

      - name: Build APKs (split per ABI)
        run: |
          cd "$GITHUB_WORKSPACE/contrast_coach"
          flutter build apk --release --split-per-abi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: contrast_coach/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: contrast_coach/build/app/outputs/flutter-apk/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: contrast_coach/build/app/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Upload to Play Store (internal track)
        if: ${{ env.PLAY_SERVICE_ACCOUNT != '' }}
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: com.contrastcoach.contrast_coach
          releaseFiles: contrast_coach/build/app/outputs/bundle/release/app-release.aab
          track: internal
          mappingFile: contrast_coach/build/app/outputs/mapping/release/mapping.txt
        continue-on-error: true
