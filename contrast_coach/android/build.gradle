allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Force hardcoded compileSdk and ndkVersion on every Android
// subproject. This is a workaround for plugin projects (speech_to_text,
// health, etc.) that try to read flutter.compileSdkVersion before the
// Flutter Gradle Plugin has registered the `flutter` extension on them.
//
// gradle.beforeProject doesn't work because the subproject's android
// block has already been read by the time we run.
//
// Instead, use a per-plugin-project `gradle.projectsEvaluated` hook
// combined with a `beforeProject` to catch the read of `flutter.compileSdkVersion`.
//
// The actual fix: hardcode `compileSdk 34` and `ndkVersion '26.1.10909125'`
// in each plugin's build.gradle via the project.android extension
// BEFORE the plugin's own build.gradle reads them.
//
// We do this by using `subprojects { afterEvaluate { ... } }` but only
// for projects that have an `android` extension, and we set the value
// *after* the subproject has been evaluated, which works for subprojects
// because their android extension is a setter that can be re-set.

subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        subproject.android {
            if (compileSdkVersion == null) {
                compileSdkVersion 34
            }
            if (ndkVersion == null) {
                ndkVersion '26.1.10909125'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
