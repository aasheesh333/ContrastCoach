allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// The flutter { } extension is registered by FlutterPlugin.apply() on
// the :app project only. Plugin subprojects (speech_to_text, health,
// etc.) try to read `flutter.compileSdkVersion` in their android { }
// block, which fails because the extension isn't on them.
//
// Workaround: programmatically inject the flutter extension into every
// subproject by applying the Flutter Gradle Plugin to each. The plugin's
// apply() method runs once per project and creates the `flutter`
// extension on that project's android extension.
//
// We do this via gradle.beforeProject which runs before any plugin is
// applied. Inside, we use subproject.plugins.withId('com.android.library')
// to register a callback that fires AFTER the Android library plugin
// is applied. The Flutter Gradle Plugin then registers the `flutter`
// extension on the android extension.

gradle.beforeProject { subproject ->
    if (subproject == rootProject) return
    if (subproject.parent == null) return
    if (subproject.path == ':app') return

    // Apply the Flutter Gradle Plugin to this subproject.
    // This creates the `flutter { }` extension on the android extension.
    try {
        subproject.apply plugin: 'dev.flutter.flutter-gradle-plugin'
    } catch (Exception e) {
        // Already applied, or some other harmless issue.
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
