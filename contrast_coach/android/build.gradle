allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Force hardcoded compileSdk and ndkVersion on every Android
// subproject. This is a workaround for plugin projects (speech_to_text,
// health, etc.) that try to read flutter.compileSdkVersion before the
// Flutter Gradle Plugin has registered the `flutter` extension on them.
//
// We do this in beforeProject (not afterEvaluate) so it runs before
// the subproject's android { compileSdk = flutter.compileSdkVersion }
// block is evaluated.
//
// Reference: https://docs.gradle.org/current/userguide/build_lifecycle.html
gradle.beforeProject { project ->
    if (project == rootProject) return
    if (!project.hasProperty('android')) return
    // Defer the actual mutation until after android plugin is applied
    project.plugins.withId('com.android.library') {
        project.android {
            if (compileSdkVersion == null) {
                compileSdkVersion 34
            }
            if (ndkVersion == null) {
                ndkVersion '26.1.10909125'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
