// Flutter Gradle Plugin stub for plugin subproject compatibility.
// Some plugins (shared_preferences_android, speech_to_text, etc.) reference
// flutter.compileSdkVersion from their own android { } or top-level blocks.
// The real Flutter Gradle Plugin only registers on :app.
// This stub registers on root + every subproject so all plugins resolve.
class FlutterPluginStub {
    int compileSdkVersion = 34
    int minSdkVersion = 21
    int targetSdkVersion = 34
    String ndkVersion = "27.0.12077973"
}

// Register on ROOT project (required by KTS plugins like shared_preferences_android)
if (rootProject.extensions.findByName('flutter') == null) {
    rootProject.extensions.add('flutter', new FlutterPluginStub())
}

gradle.beforeProject { subproject ->
    if (subproject.path == ':app') { return }

    if (subproject.extensions.findByName('flutter') == null) {
        subproject.extensions.add('flutter', new FlutterPluginStub())
    }

    subproject.plugins.withId('com.android.library') {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null && androidExt.extensions.findByName('flutter') == null) {
            androidExt.extensions.add('flutter', new FlutterPluginStub())
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = new File(rootProject.buildDir, project.name)
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
