// Some Flutter plugins (e.g. shared_preferences_android)
// reference `flutter.compileSdkVersion` from within their android { } block.
// The real Flutter Gradle Plugin only registers the `flutter` extension on the :app project.
// Plugin subprojects fail with: "Could not get unknown property 'flutter'"
//
// We work around this by registering a minimal `flutter` stub on every plugin subproject.
// Added explicit getter methods for KTS (Kotlin) plugin compatibility.
class FlutterPluginStub {
    int compileSdkVersion = 34
    int minSdkVersion = 21
    int targetSdkVersion = 34
    String ndkVersion = "27.0.12077973"

    int getCompileSdkVersion() { return compileSdkVersion }
    int getMinSdkVersion() { return minSdkVersion }
    int getTargetSdkVersion() { return targetSdkVersion }
    String getNdkVersion() { return ndkVersion }

    // Properties used by KTS plugins (shared_preferences_android)
    int getCompileSdk() { return compileSdkVersion }
    int getMinSdk() { return minSdkVersion }
    int getTargetSdk() { return targetSdkVersion }
}

gradle.beforeProject { subproject ->
    if (subproject == rootProject) { return }
    if (subproject.path == ':app') { return }

    if (subproject.extensions.findByName('flutter') == null) {
        subproject.extensions.add('flutter', new FlutterPluginStub())
    }

    subproject.plugins.withId('com.android.library') {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null && androidExt.extensions.findByName('flutter') == null) {
            androidExt.extensions.add('flutter', new FlutterPluginStub())
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "\${rootProject.buildDir}/\${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
