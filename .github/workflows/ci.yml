name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: contrast_coach

jobs:
  test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('contrast_coach/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('contrast_coach/android/gradle/wrapper/gradle-wrapper.properties', 'contrast_coach/android/settings.gradle', 'contrast_coach/android/**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/ || true

      - name: Run tests
        run: flutter test --coverage

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('contrast_coach/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('contrast_coach/android/gradle/wrapper/gradle-wrapper.properties', 'contrast_coach/android/settings.gradle', 'contrast_coach/android/**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Extract Firebase API key from google-services.json
        id: firebase-key
        run: |
          FIREBASE_API_KEY=$(python3 -c "
          import json, sys
          with open('android/app/google-services.json') as f:
              data = json.load(f)
          for client in data.get('client', []):
              for key in client.get('api_key', []):
                  if key.get('current_key', '') != 'REPLACE_WITH_FIREBASE_API_KEY':
                      print(key['current_key'])
                      sys.exit(0)
          print('', end='')
          ")
          echo "key=$FIREBASE_API_KEY" >> "$GITHUB_OUTPUT"

      - name: Extract Google Web Client ID from google-services.json
        id: google-client-id
        run: |
          GOOGLE_WEB_CLIENT_ID=$(python3 -c "
          import json, sys
          with open('android/app/google-services.json') as f:
              data = json.load(f)
          for client in data.get('client', []):
              for oauth in client.get('oauth_client', []):
                  if oauth.get('client_type') == 3:
                      print(oauth['client_id'])
                      sys.exit(0)
          # Fallback: check other_platform_oauth_client
          for client in data.get('client', []):
              services = client.get('services', {})
              for oauth in services.get('appinvite_service', {}).get('other_platform_oauth_client', []):
                  if oauth.get('client_type') == 3:
                      print(oauth['client_id'])
                      sys.exit(0)
          print('', end='')
          ")
          echo "id=$GOOGLE_WEB_CLIENT_ID" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          flutter build apk --debug --flavor dev \
            --dart-define=FIREBASE_API_KEY=${{ steps.firebase-key.outputs.key }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ steps.google-client-id.outputs.id }} \
            --dart-define=ENV=dev

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: contrast_coach/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
          if-no-files-found: error