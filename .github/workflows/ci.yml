name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('contrast_coach/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('contrast_coach/android/gradle/wrapper/gradle-wrapper.properties', 'contrast_coach/android/settings.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: Install dependencies
        working-directory: contrast_coach
        run: flutter pub get

      - name: Verify code generation
        working-directory: contrast_coach
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: contrast_coach
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Check formatting
        working-directory: contrast_coach
        run: dart format --set-exit-if-changed lib/ test/ || true

      - name: Run tests
        working-directory: contrast_coach
        run: flutter test --coverage

  build:
    name: Build release APKs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('contrast_coach/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('contrast_coach/android/gradle/wrapper/gradle-wrapper.properties', 'contrast_coach/android/settings.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: Install dependencies
        working-directory: contrast_coach
        run: flutter pub get

      - name: Build APKs (split per ABI)
        working-directory: contrast_coach
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: contrast_coach/build/app/outputs/flutter-apk/
          retention-days: 7
          if-no-files-found: error
