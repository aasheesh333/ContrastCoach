name: Release Internal

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: contrast_coach

jobs:
  release:
    name: Build AAB + universal APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Extract Firebase API key from google-services.json
        id: firebase-key
        run: |
          FIREBASE_API_KEY=$(python3 -c "
          import json, sys
          with open('android/app/google-services.json') as f:
              data = json.load(f)
          for client in data.get('client', []):
              for key in client.get('api_key', []):
                  if key.get('current_key', '') != 'REPLACE_WITH_FIREBASE_API_KEY':
                      print(key['current_key'])
                      sys.exit(0)
          print('', end='')
          ")
          echo "key=$FIREBASE_API_KEY" >> "$GITHUB_OUTPUT"

      - name: Extract Google Web Client ID from google-services.json
        id: google-client-id
        run: |
          GOOGLE_WEB_CLIENT_ID=$(python3 -c "
          import json, sys
          with open('android/app/google-services.json') as f:
              data = json.load(f)
          for client in data.get('client', []):
              for oauth in client.get('oauth_client', []):
                  if oauth.get('client_type') == 3:
                      print(oauth['client_id'])
                      sys.exit(0)
          # Fallback: check other_platform_oauth_client
          for client in data.get('client', []):
              services = client.get('services', {})
              for oauth in services.get('appinvite_service', {}).get('other_platform_oauth_client', []):
                  if oauth.get('client_type') == 3:
                      print(oauth['client_id'])
                      sys.exit(0)
          print('', end='')
          ")
          echo "id=$GOOGLE_WEB_CLIENT_ID" >> "$GITHUB_OUTPUT"

      - name: Write release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > android/app/release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          storeFile=release.keystore
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Verify code generation
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Build App Bundle
        run: |
          flutter build appbundle --release --flavor prod \
            --dart-define=FIREBASE_API_KEY=${{ steps.firebase-key.outputs.key }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ steps.google-client-id.outputs.id }} \
            --dart-define=ENV=prod

      - name: Build universal APK
        run: |
          flutter build apk --release --flavor prod \
            --dart-define=FIREBASE_API_KEY=${{ steps.firebase-key.outputs.key }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ steps.google-client-id.outputs.id }} \
            --dart-define=ENV=prod

      - name: List build outputs
        run: find build/app/outputs -type f 2>&1 | head -30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: contrast_coach/build/app/outputs/bundle/**/app-*-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: contrast_coach/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Play Store (internal track)
        if: ${{ env.PLAY_SERVICE_ACCOUNT != '' }}
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: com.dhanuk.contrastcoach
          releaseFiles: contrast_coach/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
