name: Release Internal

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: contrast_coach

jobs:
  release:
    name: Build AAB + APKs + upload artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p contrast_coach/android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > contrast_coach/android/app/google-services.json
            echo "google-services.json written"
          else
            echo "GOOGLE_SERVICES_JSON secret not set, skipping"
          fi

      - name: Build App Bundle
        run: flutter build appbundle --release --flavor prod 2>&1 | tail -200

      - name: Build APKs (split per ABI)
        run: flutter build apk --release --flavor prod --split-per-abi 2>&1 | tail -50

      - name: List build outputs
        run: ls -laR contrast_coach/build/app/outputs/ 2>&1 | tail -30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: contrast_coach/build/app/outputs/bundle/**/app-*-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: contrast_coach/build/app/outputs/flutter-apk/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: contrast_coach/build/app/outputs/mapping/**/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Upload to Play Store (internal track)
        if: ${{ env.PLAY_SERVICE_ACCOUNT != '' }}
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: com.dhanuk.contrastcoach
          releaseFiles: contrast_coach/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          mappingFile: contrast_coach/build/app/outputs/mapping/prodRelease/mapping.txt
        continue-on-error: true
